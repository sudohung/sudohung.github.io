    <title>Templatical · Mailchimp 模板编辑器</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6f8; }
      #app { height: 100%; display: flex; flex-direction: column; }
      header { min-height: 64px; flex: 0 0 auto; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 18px; background: #101828; color: #fff; }
      header .title { font-weight: 700; white-space: nowrap; flex: 0 0 auto; }
      header .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; min-width: 0; flex: 1 1 auto; }
      header select, header input { height: 30px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; padding: 0 8px; }
      header select option { color: #111; }
      #editor { flex: 1 1 auto; min-height: 0; }
      #status { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d0d5dd; }
      .actions { position: fixed; right: 20px; bottom: 18px; z-index: 9999; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: rgba(16,24,40,.92); color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.25); font-size: 12px; }
      .actions button { border: 0; border-radius: 6px; padding: 7px 10px; background: #7c5cff; color: #fff; cursor: pointer; font-weight: 700; }
      .actions button.ghost { background: rgba(255,255,255,.14); }
      .actions a { color: #b9a9ff; text-decoration: none; }
    </style>
    <script type="module" crossorigin src="/mailchimp/templatical/assets/index-Csx8wBLZ.js"></script>
    <link rel="stylesheet" crossorigin href="/mailchimp/templatical/assets/index-DTPwbgBQ.css">

    <link rel="stylesheet" href="/mailchimp/templatical/draft-save.css">
    <link rel="stylesheet" href="/mailchimp/templatical/import-html.css">
    <link rel="stylesheet" href="/mailchimp/templatical/variables.css">
    <link rel="stylesheet" href="/mailchimp/templatical/preview.css">
  </head>
  <body>
    <script>
      (function () {
        if (!window.crypto) window.crypto = {};
        if (typeof window.crypto.randomUUID === 'function') return;
        function randomUUID() {
          var bytes = new Uint8Array(16);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(bytes);
          } else {
            for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
          }
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = Array.prototype.map.call(bytes, function (b) {
            return ('0' + b.toString(16)).slice(-2);
          }).join('');
          return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
        }
        try {
          window.crypto.randomUUID = randomUUID;
        } catch (e) {
          Object.defineProperty(window.crypto, 'randomUUID', { value: randomUUID });
        }
      })();
    </script>

    <div id="app">
      <header>
        <div class="title">Templatical · Mailchimp 模板编辑器</div>
        <div class="controls">
          <label>账号</label>
          <select id="account"></select>
          <label>模板名称</label>
          <input id="name" style="width:280px" />
          <span id="status">初始化中...</span>
          <button id="mc-rl-open" class="mc-rl-header-btn" type="button" title="从系统资源库选择图片">资源库</button>
          <button id="mc-import-open" class="mc-import-header-btn" type="button" title="把 HTML 邮件转换成 Templatical 区块">导入 HTML</button>
          <button id="mc-draft-save" class="mc-draft-header-btn" type="button" title="只保存到本地草稿，不创建 Mailchimp 模板">存纯草稿</button>
          <button id="mc-draft-open" class="mc-draft-header-btn" type="button" title="打开本地纯草稿箱">草稿箱</button>
          <button id="mc-preview-open" class="mc-preview-header-btn" type="button" title="用 token_html + 示例值渲染预览">预览</button>
          <a class="mc-var-flow-link" href="/mailchimp/templatical/send-simulator.html" target="_blank" rel="noreferrer">发送模拟</a>
          <a class="mc-var-flow-link" href="/mailchimp/templatical/variable-flow.html" target="_blank" rel="noreferrer">变量流程</a>
        </div>
      </header>
      <div id="editor"></div>
      <div class="actions">
        <button id="save">保存为 Mailchimp 模板</button>
        <button id="download" class="ghost">下载 HTML</button>
        <a id="view" href="/mailchimp/#step-templates" target="_blank" rel="noreferrer" style="display:none"></a>
      </div>
    </div>

    <script src="/mailchimp/templatical/preview.js" defer></script>
    <script src="/mailchimp/templatical/import-html.js" defer></script>
    <script src="/mailchimp/templatical/snapshot-save.js" defer></script>
  </body>
</html>
